plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.amma.tv'
    compileSdk 34

    defaultConfig {
        // its own app id: installs NEXT TO Yogi TV, never over it
        applicationId "com.amma.tv"
        minSdk 21
        targetSdk 34
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode run
        versionName "1.${run}"
    }

    // Same key for every build, so a new APK installs OVER the old AMMA (keeps what was watched).
    signingConfigs {
        amma {
            storeFile rootProject.file('amma.p12')
            storePassword 'yogitv-private'
            keyAlias 'yogi'
            keyPassword 'yogitv-private'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.amma
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.amma
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // live TV from m3u lists
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.0'
    implementation 'androidx.media3:media3-ui:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
